services:
  - type: web
    name: lzr-server
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    healthCheckPath: /health
    envVars:
      - key: LZR_ADMIN_USER
        sync: false
      - key: LZR_ADMIN_PASSWORD
        sync: false
      - key: LZR_SESSION_SECRET
        generateValue: true
      - key: LZR_KEY_PREFIX
        value: fletxo_
      - key: LZR_DATA_DIR
        value: /var/data
    disk:
      name: lzr-data
      mountPath: /var/data
      sizeGB: 1
